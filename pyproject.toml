[project]
name = "nmma-astrocolibri-sn2021ugl"
version = "1.0.0"
description = "Reproducibility package for the SN 2021ugl case study in the NMMA-Astro-COLIBRI paper"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    # Pinned to a specific commit rather than @main for reproducibility --
    # main can change after this package is archived. Switch to a plain
    # PyPI version pin ("nmma==1.0.2") once the 1.0.2 release is published
    # to PyPI -- as of 2026-08-22 the v1.0.2 GitHub tag exists but PyPI
    # still only serves up to 1.0.1.
    "nmma @ git+https://github.com/nuclear-multimessenger-astronomy/nmma.git@4342b6abb1d70eb6f3e60afcc138662386d3c29a",
    "matplotlib",
    "numpy",
    "astropy",
]

# PyMultiNest is installed separately by `make setup` (see Makefile / docs/INSTALL.md):
# it wraps a MultiNest binary that must be compiled from source first, so it
# cannot be resolved as a normal PyPI/uv dependency.

[dependency-groups]
dev = [
    "pre-commit",
]
